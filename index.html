<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurable Form Builder</title>
    <meta name="description" content="Build, preview and export configurable forms." />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      // Mirrors useTheme (src/hooks/useTheme.ts), which takes over once React mounts.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('configurable-form-builder:theme') || 'system';
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
